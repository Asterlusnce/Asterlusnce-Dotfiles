# font_family      Iosevka NF
font_family      JetBrains Mono
# font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

#modify_font cell_height 120%
font_size 11
#enable_ligatures always

# tabs
#tab_bar_edge bottom
#tab_bar_style powerline
#fade, slant, separator, powerline, hidden, custom
#tab_bar_align left
#tab_powerline_style round
# angled, slanted, round
#tab_bar_margin_width 0
#tab_separator " "

active_tab_font_style   bold-italic
inactive_tab_font_style normal
tar_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# bg
background_blur 2
background_opacity 0.6
background_image none
background_image_linear no
dynamic_background_opacity yes
background_tint 1
selection_foreground #000

# Window margins in pts.
window_margin_width 15

# Animated
cursor_trail 4
custom_shaders water

# Window padding in pts.
window_padding_width 0

# Ask for confirmation when closing an OS window.
confirm_os_window_close 0
wheel_scroll_multiplier 5.0
enable_audio_bell yes
open_url_modifiers ctrl+shift
open_url_with default

# Shell 
shell fish
include themes/noctalia.conf
